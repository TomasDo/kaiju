<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Character Models · Visual Check</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9eee9;color:#263a36;font:13px/1.5 -apple-system,BlinkMacSystemFont,sans-serif}#renderer{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:0}main{position:relative;z-index:1;max-width:1600px;margin:auto;padding:18px 22px 12px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:16px}h1{font-size:22px;letter-spacing:-.6px;margin:0 0 3px;font-weight:650}header p{margin:0;font-size:11px;color:#63756e}.controls{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end}button,a{color:inherit;font:inherit;font-size:11px;white-space:nowrap}button{cursor:pointer;border:1px solid #bfcec3;background:#f7faf7;border-radius:6px;padding:7px 12px}button:hover{background:#dfe8df}button[aria-pressed=true]{background:#314e42;border-color:#314e42;color:#fff}a{margin-left:8px;text-decoration:none}a:hover{text-decoration:underline}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.card{border:1px solid #cbd6cc;border-radius:10px;overflow:hidden;box-shadow:0 3px 10px #2d493509;background:transparent}.card h2{display:flex;justify-content:space-between;align-items:center;gap:5px;font-size:13px;font-weight:600;margin:0;padding:10px 13px 7px;background:#f5f8f3;line-height:1.3}.tag{font-size:10px;letter-spacing:.3px;color:#76867a;font-weight:400}.viewport{height:248px;position:relative}.note{margin:0;min-height:49px;padding:8px 13px 10px;background:#f5f8f3;font-size:10px;line-height:1.55;color:#637469}.note strong{font-weight:500;color:#405b4b}footer{display:flex;justify-content:space-between;gap:15px;margin-top:11px;font-size:10px;color:#6a7b70}.error{padding:30px;background:#fff0e7;color:#8b3f2d;border:1px solid #dba28b;margin-top:20px;white-space:pre-wrap}#status{font-variant-numeric:tabular-nums}@media(min-width:1500px){.viewport{height:300px}}@media(max-width:920px){header{align-items:flex-start;flex-direction:column;gap:9px}.controls{justify-content:flex-start}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.viewport{height:280px}}@media(max-width:500px){main{padding:14px 12px}.grid{gap:9px}.viewport{height:220px}.card h2{padding:9px;font-size:12px}.tag{display:none}.note{padding:7px 9px;font-size:10px;min-height:63px}footer{flex-direction:column;gap:3px}.controls{gap:4px}button{padding:6px 9px}}
</style>
<style>.hero-controls{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin:-6px 0 13px;color:#637469;font-size:11px}.hero-controls span{margin-right:4px}.hero-stage{color:#7045a8;font-weight:600}</style>
<script src="../vendor/three.min.js"></script>
<script src="../boss-model.js"></script>
<script src="../unit-visual.js"></script>
<script src="../kaiju-visual.js"></script>
</head>
<body>
<canvas id="renderer" aria-hidden="true"></canvas>
<main>
  <header>
    <div><h1>Character Models · Visual Check</h1><p>Production game models · Individually framed cards show the original model scale and hit rules.</p></div>
    <div class="controls" aria-label="Fixed view and animation controls">
      <button data-view="front" aria-pressed="true">Front 3/4</button>
      <button data-view="back" aria-pressed="false">Rear 3/4</button>
      <button data-view="side" aria-pressed="false">Side</button>
      <button id="motion" aria-pressed="false">Motion: Still</button>
      <a href="../kaiju-destroyer.html">Back to game ↗</a>
    </div>
  </header>
  <div class="hero-controls" aria-label="Bloom Hero ability pose selection"><span>Bloom Hero poses</span><button data-hero-state="cycle" aria-pressed="true">Four-phase cycle</button><button data-hero-state="chase" aria-pressed="false">Chase</button><button data-hero-state="charge" aria-pressed="false">Charge</button><button data-hero-state="spray" aria-pressed="false">Spray</button><button data-hero-state="recover" aria-pressed="false">Recovery · Weak point open</button></div>
  <div class="grid" id="grid"></div>
  <footer><span>Check: Faces and workwear / Ally scale / Vehicle silhouettes / Rear weak point / Kaiju spines, neck, and tail joints</span><span id="status">Creating models…</span></footer>
</main>
<script>
(() => {
  const grid = document.getElementById('grid');
  const status = document.getElementById('status');
  const definitions = [
    {type:'soldier',variant:0,title:'Worker · Blue Shirt',tag:'Ally / Patrol',note:'<strong>Standard coworker height and silhouette</strong><br>Loose tie, ID badge, and briefcase; about 2.0 units tall in game.'},
    {type:'soldier',variant:1,title:'Worker · Glasses',tag:'Ally / Cheer',note:'<strong>Glasses and an ivory shirt</strong><br>Raises arms to cheer in motion mode; never attacks the player.'},
    {type:'soldier',variant:2,title:'Worker · Fast Walk',tag:'Ally / Evasion',note:'<strong>Independent legs and bag-carrying arm</strong><br>Motion mode shows urgent walking, a forward lean, and swinging arms.'},
    {type:'tank',title:'Tank',tag:'Enemy / Ground',note:'<strong>Full tracks, wheels, turret, and barrel</strong><br>Headlights, service hatches, engine grilles, and antenna.'},
    {type:'helicopter',title:'Helicopter',tag:'Enemy / Air',note:'<strong>Cockpit, tail boom, skids, and two rotors</strong><br>Main and tail rotors spin together in motion mode.'},
    {type:'fartHero',title:'Bloom Hero',tag:'Enemy / Rear ×5',note:'<strong>Green suit, purple mask, split short cape, and gold flower emblem</strong><br>Lower-back petals open during recovery; <span class="hero-stage">Chase</span>. Play motion to inspect the full four-phase cycle.'},
    {type:'boss',title:'Suited Boss',tag:'Enemy / Rooftop',note:'<strong>Shirt, tie, suit, and briefcase</strong><br>Individually framed to reveal details; original scale is retained in game.'},
    {type:'kaiju',title:'Kaiju',tag:'Player / Continuous silhouette',note:'<strong>Three exposed rows of spines, continuous neck, and tapered tail</strong><br>Switch to the side view to inspect joints; fire and footstep anchors are unchanged.'}
  ];
  let renderer;
  try{
    renderer = new THREE.WebGLRenderer({canvas:document.getElementById('renderer'), antialias:true, alpha:true});
  }catch(error){
    status.textContent='WebGL unavailable';
    const message=document.createElement('p');message.className='error';message.textContent='Could not create WebGL scene: '+error.message;grid.after(message);return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.04;
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.autoClear=false;
  let view='front', motion=false, elapsed=1.20, lastFrame=0, heroSelection='cycle';
  const heroPhases=[{state:'chase',duration:1.5,label:'Chase'},{state:'charge',duration:0.7,label:'Charge · Inflate and stop'},{state:'spray',duration:0.3,label:'Spray · Recoil'},{state:'recover',duration:1.2,label:'Recovery · Petals open / Rear ×5'}];
  const views={front:new THREE.Vector3(0.64,0.30,1),back:new THREE.Vector3(-0.64,0.30,-1),side:new THREE.Vector3(1,0.23,0.02)};
  const entries=[];

  for(const definition of definitions){
    const card=document.createElement('article');card.className='card';
    card.innerHTML='<h2>'+definition.title+'<span class="tag">'+definition.tag+'</span></h2><div class="viewport" role="img" aria-label="'+definition.title+' 3D model"></div><p class="note">'+definition.note+'</p>';
    grid.appendChild(card);
    const scene=new THREE.Scene();scene.background=new THREE.Color(0xe3e9df);
    scene.add(new THREE.HemisphereLight(0xf0f6ff,0xacaf95,2.1));
    const model=definition.type==='kaiju' ? KaijuVisual.create() : definition.type==='boss' ? BossVisual.create() : UnitVisual.create(definition.type,{variant:definition.variant});
    scene.add(model);
    const bounds=new THREE.Box3().setFromObject(model), size=bounds.getSize(new THREE.Vector3()), center=bounds.getCenter(new THREE.Vector3());
    const radius=size.length()*0.5;
    const key=new THREE.DirectionalLight(0xffefd6,3.1);
    key.position.copy(center).add(new THREE.Vector3(-radius*2,radius*3,radius*3));
    key.target.position.copy(center);scene.add(key,key.target);key.castShadow=true;
    key.shadow.mapSize.set(512,512);key.shadow.camera.left=key.shadow.camera.bottom=-radius*1.3;key.shadow.camera.right=key.shadow.camera.top=radius*1.3;
    key.shadow.camera.near=0.02;key.shadow.camera.far=radius*10;key.shadow.normalBias=radius*0.009;
    const fill=new THREE.DirectionalLight(0xd1e5ed,1.45);fill.position.copy(center).add(new THREE.Vector3(radius*2,radius,-radius*2));scene.add(fill);
    const floor=new THREE.Mesh(new THREE.PlaneGeometry(radius*8,radius*8),new THREE.ShadowMaterial({color:0x4d6955,opacity:0.16}));
    floor.rotation.x=-Math.PI/2;floor.position.y=bounds.min.y-0.01;floor.receiveShadow=true;scene.add(floor);
    const camera=new THREE.OrthographicCamera(-1,1,1,-1,0.01,radius*20);
    const corners=[];for(const x of [bounds.min.x,bounds.max.x]) for(const y of [bounds.min.y,bounds.max.y]) for(const z of [bounds.min.z,bounds.max.z]) corners.push(new THREE.Vector3(x,y,z));
    let count=0;model.traverse(part=>{if(part.isMesh)count++;});
    entries.push({definition,element:card.querySelector('.viewport'),scene,model,camera,center,radius,corners,count});
  }

  function pose(entry,time){
    const {definition,model}=entry;
    if(definition.type==='boss') BossVisual.animate(model,time,motion?0.85:0);
    else if(definition.type==='kaiju'){
      const stride=motion?Math.sin(time*6.5):0;
      for(const {side,leg} of model.userData.legs){
        const phase=stride*side;
        leg.rotation.x=phase*0.34;leg.rotation.z=leg.userData.baseZRot+phase*0.08;
        leg.position.y=2.28+Math.abs(stride)*0.1;leg.position.z=0.35-phase*0.12;
        for(const foot of leg.children){if(foot.userData.baseY===undefined)continue;
          foot.position.y=foot.userData.baseY+Math.max(0,phase)*0.28;
          foot.position.z=foot.userData.baseZ+Math.max(0,phase)*0.16;
          foot.rotation.x=-leg.rotation.x*0.35;
        }
      }
    }else if(definition.type==='fartHero'){
      let phase=0.7, chosen=heroPhases.find(item=>item.state===heroSelection);
      if(!chosen){let cycle=time%3.7;for(const item of heroPhases){if(cycle<item.duration){chosen=item;phase=cycle/item.duration;break;}cycle-=item.duration;}}
      UnitVisual.animate(model,{time,moving:motion&&chosen.state==='chase',heroState:chosen.state,phase,weaknessOpen:chosen.state==='recover'});
      entry.element.parentElement.querySelector('.hero-stage').textContent=chosen.label;
    }else UnitVisual.animate(model,{time,moving:motion&&definition.variant!==1,cheering:motion&&definition.type==='soldier'&&definition.variant===1,panic:definition.type==='soldier'&&definition.variant===2});
  }

  function render(now){
    const delta=lastFrame?Math.min(0.05,(now-lastFrame)/1000):0;lastFrame=now;if(motion)elapsed+=delta;
    const width=window.innerWidth,height=window.innerHeight;
    const canvas=renderer.domElement;
    if(canvas.width!==Math.floor(width*renderer.getPixelRatio())||canvas.height!==Math.floor(height*renderer.getPixelRatio()))renderer.setSize(width,height,false);
    renderer.setScissorTest(false);renderer.setClearColor(0x000000,0);renderer.clear();renderer.setScissorTest(true);
    let visible=0;
    for(const entry of entries){
      const rect=entry.element.getBoundingClientRect();
      if(rect.bottom<=0||rect.top>=height||rect.right<=0||rect.left>=width)continue;
      pose(entry,elapsed);
      const {camera,center,radius}=entry;
      camera.position.copy(center).addScaledVector(views[view].clone().normalize(),radius*5);
      camera.lookAt(center);camera.updateMatrixWorld(true);
      const projected=entry.corners.map(point=>point.clone().applyMatrix4(camera.matrixWorldInverse));
      const spanX=Math.max(...projected.map(p=>p.x))-Math.min(...projected.map(p=>p.x));
      const spanY=Math.max(...projected.map(p=>p.y))-Math.min(...projected.map(p=>p.y));
      const aspect=rect.width/rect.height;
      const halfHeight=Math.max(spanY*0.5,spanX/aspect*0.5)*1.12;
      camera.left=-halfHeight*aspect;camera.right=halfHeight*aspect;camera.top=halfHeight;camera.bottom=-halfHeight;camera.updateProjectionMatrix();
      renderer.setViewport(rect.left,height-rect.bottom,rect.width,rect.height);renderer.setScissor(rect.left,height-rect.bottom,rect.width,rect.height);
      renderer.setClearColor(0xe3e9df,1);renderer.clear();renderer.render(entry.scene,camera);visible++;
    }
    status.textContent='One renderer · '+visible+' / '+entries.length+' views · Total meshes: '+entries.reduce((sum,entry)=>sum+entry.count,0);
    requestAnimationFrame(render);
  }
  document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{
    view=button.dataset.view;document.querySelectorAll('[data-view]').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));
  }));
  document.getElementById('motion').addEventListener('click',event=>{
    motion=!motion;event.currentTarget.setAttribute('aria-pressed',String(motion));event.currentTarget.textContent='Motion: '+(motion?'Playing':'Still');
  });
  document.querySelectorAll('[data-hero-state]').forEach(button=>button.addEventListener('click',()=>{
    heroSelection=button.dataset.heroState;document.querySelectorAll('[data-hero-state]').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));
  }));
  window.addEventListener('pagehide',()=>{
    for(const entry of entries){
      if(entry.definition.type==='boss')BossVisual.dispose(entry.model);
      else if(entry.definition.type==='kaiju')KaijuVisual.dispose(entry.model);
      else UnitVisual.dispose(entry.model);
    }
    renderer.dispose();
  },{once:true});
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
